<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rhythm Dodge — 2-Lane Rhythm Game</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0e1117;
    color: #e6edf3;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 10px;
  }
  
  .status-bar {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 8px;
    padding: 0 4px;
    color: #8b949e;
  }
  .status-bar span { color: #79c0ff; font-weight: bold; }
  .status-bar .best { color: #f0c674; }

  .stage {
    position: relative;
    width: 100%;
    max-width: 480px;
  }
  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    touch-action: none;
  }
  
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(13, 17, 23, 0.9);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    gap: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 24px; color: #58a6ff; }
  .overlay .rule-text { color: #c9d1d9; font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
  .overlay button {
    background: #238636;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 12px 24px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .overlay button:hover { background: #2ea043; }

  .controls-wrapper {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
  }
  
  .speed-row {
    display: flex;
    gap: 8px;
    width: 100%;
  }
  .speed-row button {
    background: #21262d;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .speed-row button:hover { background: #30363d; }
  .speed-row .speed-display {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #f0c674;
    font-weight: 600;
    font-size: 14px;
  }
  .speed-row .speed-display span { color: #79c0ff; margin-left: 6px; }

  .action-row {
    display: flex;
    gap: 8px;
    width: 100%;
  }
  .action-row button {
    flex: 1;
    background: #21262d;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .action-row button:hover { background: #30363d; }
  .action-row button.active { background: #1f6feb; border-color: #1f6feb; }
  
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="status-bar">
  <div>시간: <span id="ui-time">30.0</span>s</div>
  <div>성공: <span id="ui-success">0</span></div>
  <div>실패: <span id="ui-fail">0</span></div>
  <div class="best">최고: <span id="ui-best">0.0초</span></div>
</div>

<div class="stage">
  <canvas id="game" width="480" height="640"></canvas>
  
  <div id="overlay" class="overlay">
    <h2 id="overlay-title">Rhythm Dodge</h2>
    <div id="overlay-desc" class="rule-text">
      오른쪽에서 왼쪽으로 오는 도형이<br>판정선에 닿는 순간 해당 키를 누르세요.<br><br>
      <b>D</b> = 위쪽 레인 / <b>K</b> = 아래쪽 레인<br>
      <b>P</b> = 일시정지 / <b>R</b> = 재시작 / <b>M</b> = 음소거<br><br>
      실패 3회 시 게임 오버, 30초 생존 시 성공
    </div>
    <button id="overlay-btn">시작</button>
  </div>
</div>

<div class="controls-wrapper">
  <div class="speed-row">
    <button id="btn-speed-down" title="속도 줄이기 (단축키: [)">-</button>
    <div class="speed-display">SPEED <span id="speed-value">180</span></div>
    <button id="btn-speed-up" title="속도 높이기 (단축키: ])">+</button>
  </div>

  <div class="action-row">
    <button id="btn-pause">일시정지 (P)</button>
    <button id="btn-restart">재시작 (R)</button>
    <button id="btn-mute">음소거: OFF (M)</button>
  </div>
</div>

<script>
'use strict';

const LANES = 2;
const LANE_KEYS = { top: 'KeyD', bottom: 'KeyK' };
const JUDGE_TOLERANCE = 40;
const NEAR_RANGE = 200;

const SPAWN_INTERVAL = 700;
const SPAWN_JITTER = 150;
const MIN_SPAWN_INTERVAL = 300;
const ROUND_SECONDS = 30;
const FAIL_LIMIT = 3;
const SAVE_KEY = 'rhythm-dodge-save-v1';
const DEFAULT_SAVE = { bestTime: 0, muted: false };

/* ===== 레이아웃 상수 (가시성 개선) ===== */
const JUDGE_LINE_X = 140;          
const NOTE_START_X = 500;          
const NOTE_W = 64;                 
const NOTE_H = 24;                 

// 상단 여백(20%)과 하단 여백(20%)을 주어 판정선 길이를 줄임
const FOOTER_START_Y = 0.80;       
const JUDGE_LINE_START_Y = 0.20;   

// 플레이 영역(20% ~ 80%) 내부의 각 레인 중앙 (35%와 65%)
const LANE_TOP_Y = 0.35;           
const LANE_BOTTOM_Y = 0.65;        

const SPEED_MIN = 100;
const SPEED_MAX = 300;
const SPEED_STEP = 10;
let NOTE_SPEED = 180; 

let hitEffects = [];

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return { ...DEFAULT_SAVE };
    const parsed = JSON.parse(raw);
    if (
      typeof parsed !== 'object' || parsed === null ||
      typeof parsed.bestTime !== 'number' || !isFinite(parsed.bestTime) ||
      typeof parsed.muted !== 'boolean'
    ) throw new Error('corrupt');
    return { bestTime: parsed.bestTime, muted: parsed.muted };
  } catch {
    return { ...DEFAULT_SAVE };
  }
}
function saveSave(data) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch {}
}

let saved = loadSave();

const round = {
  running: false, paused: false, gameOver: false,
  timeLeft: ROUND_SECONDS, success: 0, fail: 0,
  notes: [], spawnAcc: 0, lastTime: 0,
};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const uiTime = document.getElementById('ui-time');
const uiSuccess = document.getElementById('ui-success');
const uiFail = document.getElementById('ui-fail');
const uiBest = document.getElementById('ui-best');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayDesc = document.getElementById('overlay-desc');
const overlayBtn = document.getElementById('overlay-btn');
const btnPause = document.getElementById('btn-pause');
const btnRestart = document.getElementById('btn-restart');
const btnMute = document.getElementById('btn-mute');

const btnSpeedDown = document.getElementById('btn-speed-down');
const btnSpeedUp = document.getElementById('btn-speed-up');
const speedValueEl = document.getElementById('speed-value');

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playGameOverSound() {
  if (saved.muted || !audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(220, now);
  osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
  gain.gain.setValueAtTime(0.15, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.5);
}

function getLaneY(lane) {
  return lane === 0 ? canvas.height * LANE_TOP_Y : canvas.height * LANE_BOTTOM_Y; 
}
function getJudgeLineX() {
  return JUDGE_LINE_X;
}

function resetRound() {
  round.running = true; round.paused = false; round.gameOver = false;
  round.timeLeft = ROUND_SECONDS; round.success = 0; round.fail = 0;
  round.notes = []; round.spawnAcc = 0; round.lastTime = performance.now();
  hitEffects = []; 
  hideOverlay(); updateUI();
}
function startGame() { ensureAudio(); resetRound(); }

function endGame(isSuccess) {
  round.running = false; round.gameOver = true; round.notes = [];
  const survivedTime = Number((ROUND_SECONDS - round.timeLeft).toFixed(1));
  
  if (survivedTime > saved.bestTime) {
    saved.bestTime = survivedTime; 
    saveSave(saved);
  }
  playGameOverSound();
  
  overlayTitle.textContent = isSuccess ? '성공!' : '게임 오버';
  overlayDesc.innerHTML = isSuccess 
    ? `30초 생존 성공!<br>최종 생존 시간: ${survivedTime}초` 
    : `실패 3회 도달.<br>생존 시간: ${survivedTime}초`;
  overlayBtn.textContent = '다시 시작';
  overlay.classList.remove('hidden');
  
  updateUI();
}

function togglePause() {
  if (!round.running || round.gameOver) return;
  round.paused = !round.paused;
  if (!round.paused) round.lastTime = performance.now();
  btnPause.classList.toggle('active', round.paused);
  btnPause.textContent = round.paused ? '재개 (P)' : '일시정지 (P)';
  
  if (round.paused) {
    overlayTitle.textContent = '일시정지';
    overlayDesc.innerHTML = 'P 또는 아래 버튼으로 재개하세요.';
    overlayBtn.textContent = '재개';
    overlay.classList.remove('hidden');
  } else {
    hideOverlay();
  }
}

function toggleMute() {
  saved.muted = !saved.muted; saveSave(saved); updateMuteButton();
}
function updateMuteButton() {
  btnMute.textContent = `음소거: ${saved.muted ? 'ON' : 'OFF'} (M)`;
  btnMute.classList.toggle('active', saved.muted);
}

function changeSpeed(delta) {
  let newSpeed = NOTE_SPEED + delta;
  if (newSpeed < SPEED_MIN) newSpeed = SPEED_MIN;
  if (newSpeed > SPEED_MAX) newSpeed = SPEED_MAX;
  if (newSpeed !== NOTE_SPEED) {
    NOTE_SPEED = newSpeed;
    speedValueEl.textContent = NOTE_SPEED;
  }
}

function findNearestNote(lane) {
  let best = null, bestDist = Infinity;
  const judgeX = getJudgeLineX();
  for (const n of round.notes) {
    if (n.lane !== lane || n.hit) continue;
    const d = Math.abs(n.x - judgeX);
    if (d < bestDist) { bestDist = d; best = n; }
  }
  return best;
}

function spawnHitEffect(x, y, color) {
  hitEffects.push({
    x, y, radius: 5, alpha: 1.0, color,
  });
}

function judge(lane) {
  if (!round.running || round.paused || round.gameOver) return;
  const judgeX = getJudgeLineX();
  const near = findNearestNote(lane);
  console.log(`[INPUT] lane=${lane} near=${near ? 'Y' : 'N'}`);
  if (!near) return;
  const dist = Math.abs(near.x - judgeX);
  if (dist > NEAR_RANGE) return;
  
  if (dist <= JUDGE_TOLERANCE) {
    near.hit = true; round.success += 1;
    spawnHitEffect(judgeX, getLaneY(lane), '#f0c674');
  } else {
    near.hit = true; round.fail += 1;
    spawnHitEffect(judgeX, getLaneY(lane), '#f85149');
    if (round.fail >= FAIL_LIMIT) { endGame(false); return; }
  }
  updateUI();
}

function loop(now) {
  requestAnimationFrame(loop);
  if (!round.running || round.paused || round.gameOver) {
    round.lastTime = now; render(); return;
  }
  const dt = Math.min((now - round.lastTime) / 1000, 0.1);
  round.lastTime = now;
  round.timeLeft -= dt;
  if (round.timeLeft <= 0) {
    round.timeLeft = 0; endGame(true); render(); return;
  }

  round.spawnAcc += dt * 1000;
  while (round.spawnAcc >= SPAWN_INTERVAL) {
    const jitter = (Math.random() * 2 - 1) * SPAWN_JITTER;
    let nextInterval = SPAWN_INTERVAL + jitter;
    if (nextInterval < MIN_SPAWN_INTERVAL) nextInterval = MIN_SPAWN_INTERVAL;
    round.spawnAcc -= nextInterval;
    
    const lane = Math.random() < 0.5 ? 0 : 1;
    round.notes.push({ lane, x: NOTE_START_X, hit: false });
  }

  for (const n of round.notes) { n.x -= NOTE_SPEED * dt; }

  const judgeX = getJudgeLineX();
  for (const n of round.notes) {
    if (n.hit) continue;
    if (n.x < judgeX - JUDGE_TOLERANCE) {
      n.hit = true; round.fail += 1;
      spawnHitEffect(judgeX, getLaneY(n.lane), '#f85149');
      if (round.fail >= FAIL_LIMIT) { endGame(false); break; }
    }
  }

  round.notes = round.notes.filter(n => n.x > -100);
  
  hitEffects = hitEffects.filter(fx => {
    fx.radius += 120 * dt;
    fx.alpha -= 2.5 * dt;
    return fx.alpha > 0;
  });

  updateUI(); render();
}

function render() {
  const W = canvas.width, H = canvas.height;
  const judgeX = getJudgeLineX();
  const midY = H * 0.5; 
  const footerY = H * FOOTER_START_Y;
  const judgeTopY = H * JUDGE_LINE_START_Y;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  // 1. 레인 배경 구분
  ctx.fillStyle = '#11161d'; 
  ctx.fillRect(0, midY, W, midY);

  // 2. 가로 분할선 (진짜 중앙)
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(W, midY); ctx.stroke();

  // ==========================================
  // 3. 판정선 배경 띠 및 메인 라인 (20% ~ 80% 축소)
  // ==========================================
  ctx.fillStyle = 'rgba(240, 198, 116, 0.10)';
  ctx.fillRect(judgeX - JUDGE_TOLERANCE, judgeTopY, JUDGE_TOLERANCE * 2, footerY - judgeTopY);

  ctx.strokeStyle = '#f0c674'; 
  ctx.lineWidth = 3;
  ctx.beginPath(); 
  ctx.moveTo(judgeX, judgeTopY); 
  ctx.lineTo(judgeX, footerY); 
  ctx.stroke();

  // 4. D / K 안내 텍스트 (판정선 왼쪽)
  ctx.fillStyle = '#6e7681'; 
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText('D', judgeX - 12, H * LANE_TOP_Y);
  ctx.fillText('K', judgeX - 12, H * LANE_BOTTOM_Y);

  // 레인별 점선 가이드라인
  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(judgeX, H * LANE_TOP_Y); ctx.lineTo(W, H * LANE_TOP_Y);
  ctx.moveTo(judgeX, H * LANE_BOTTOM_Y); ctx.lineTo(W, H * LANE_BOTTOM_Y);
  ctx.stroke();
  ctx.setLineDash([]); 

  // ==========================================
  // 5. 하단 패널 (속도 표시용이 아니라, 디자인 통일을 위한 구분선 역할)
  // ==========================================
  ctx.save();
  ctx.fillStyle = 'rgba(22, 27, 34, 0.9)'; 
  ctx.fillRect(0, footerY, W, H - footerY);
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, footerY); ctx.lineTo(W, footerY); ctx.stroke();
  ctx.restore();

  // ==========================================
  // 6. 캔버스 내 실패 카운트 UI (게임 영역과 확실히 분리된 상단 패널)
  // ==========================================
  // 상단 독립 패널 그리기 (판정선이 시작하는 20% 위쪽 공간 활용)
  ctx.save();
  ctx.fillStyle = 'rgba(22, 27, 34, 0.9)';
  ctx.fillRect(0, 0, W, judgeTopY);
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, judgeTopY); ctx.lineTo(W, judgeTopY); ctx.stroke();
  
  // 패널 내부에 실패 카운트 텍스트 및 원형 배치
  const failColor = round.fail === 0 ? '#3fb950' : round.fail === 1 ? '#e3b341' : '#f85149';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'left'; 
  ctx.textBaseline = 'middle';
  ctx.fillStyle = failColor;
  
  ctx.fillText(`실패: ${round.fail} / ${FAIL_LIMIT}`, 20, judgeTopY / 2);
  
  for (let i = 0; i < FAIL_LIMIT; i++) {
    const isLost = i < round.fail;
    ctx.beginPath();
    ctx.arc(W - 30 - (i * 24), judgeTopY / 2, 8, 0, Math.PI * 2);
    if (isLost) { ctx.strokeStyle = failColor; ctx.lineWidth = 2; ctx.stroke(); }
    else { ctx.fillStyle = failColor; ctx.fill(); }
  }
  ctx.restore();

  // 7. 노트 그리기
  for (const n of round.notes) {
    if (n.hit) continue;
    const y = getLaneY(n.lane); 
    ctx.fillStyle = n.lane === 0 ? '#58a6ff' : '#3fb950';
    ctx.fillRect(n.x - NOTE_W / 2, y - NOTE_H / 2, NOTE_W, NOTE_H);
  }

  // 8. 판정 이펙트
  for (const fx of hitEffects) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, fx.alpha);
    ctx.beginPath();
    ctx.arc(fx.x, fx.y, fx.radius, 0, Math.PI * 2);
    ctx.strokeStyle = fx.color;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }
}

function updateUI() {
  uiTime.textContent = round.timeLeft.toFixed(1);
  uiSuccess.textContent = round.success;
  uiFail.textContent = round.fail;
  uiBest.textContent = saved.bestTime.toFixed(1) + '초';
}

function hideOverlay() { overlay.classList.add('hidden'); }

window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  
  if (e.code === 'BracketLeft') { changeSpeed(-SPEED_STEP); return; }
  if (e.code === 'BracketRight') { changeSpeed(SPEED_STEP); return; }

  if (round.running && !round.paused && !round.gameOver) {
    if (e.code === LANE_KEYS.top)    { judge(0); return; }
    if (e.code === LANE_KEYS.bottom) { judge(1); return; }
  }
  if (e.code === 'KeyP') { togglePause(); return; }
  if (e.code === 'KeyR') { startGame(); return; }
  if (e.code === 'KeyM') { toggleMute(); return; }
});

window.addEventListener('blur', () => {
  if (round.running && !round.paused && !round.gameOver) togglePause();
});

window.addEventListener('resize', () => {});

overlayBtn.addEventListener('click', () => {
  if (round.paused) togglePause(); else startGame();
});
btnPause.addEventListener('click', togglePause);
btnRestart.addEventListener('click', startGame);
btnMute.addEventListener('click', toggleMute);

btnSpeedDown.addEventListener('click', () => changeSpeed(-SPEED_STEP));
btnSpeedUp.addEventListener('click', () => changeSpeed(SPEED_STEP));

updateMuteButton(); updateUI(); render(); requestAnimationFrame(loop);
</script>
</body>
</html>
