<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PNG 체크무늬 투명화 도구</title>
<style>
  body { font: 16px system-ui,sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; background: #101722; color: #e8f1ff; }
  label,button { display: inline-block; margin: 8px 0; padding: 10px 14px; border: 1px solid #4b6987; border-radius: 6px; background: #17283a; color: inherit; }
  button { cursor: pointer; } #status { white-space: pre-wrap; color: #a9d8ff; }
</style>
<h1>PNG 체크무늬 투명화</h1>
<p>스프라이트 PNG를 선택하면 가장자리와 연결된 밝은 무채색 배경만 투명하게 바꿉니다. 흰색 내부 코어는 주변 색으로 둘러싸여 있으면 유지됩니다. 이름이 background- 또는 bg-로 시작하는 이미지는 자동으로 건너뜁니다. 다른 일반 게임 배경 이미지는 선택하지 마세요.</p>
<input id="files" type="file" accept="image/png" multiple>
<button id="convert">선택한 PNG 변환 및 저장</button>
<p id="status">변환 대기 중</p>
<script>
const fileInput = document.getElementById('files');
const status = document.getElementById('status');
const isBackdrop = (r,g,b) => Math.min(r,g,b) > 178 && Math.max(r,g,b)-Math.min(r,g,b) < 42;

async function convert(file) {
  const bitmap = await createImageBitmap(file);
  const canvas = document.createElement('canvas'); canvas.width=bitmap.width; canvas.height=bitmap.height;
  const ctx=canvas.getContext('2d',{willReadFrequently:true}); ctx.drawImage(bitmap,0,0); bitmap.close();
  const frame=ctx.getImageData(0,0,canvas.width,canvas.height), {data,width,height}=frame;
  const visited=new Uint8Array(width*height), queue=new Int32Array(width*height); let read=0,write=0;
  const add=i=>{if(!visited[i]){const p=i*4;if(isBackdrop(data[p],data[p+1],data[p+2])){visited[i]=1;queue[write++]=i;}}};
  for(let x=0;x<width;x++){add(x);add((height-1)*width+x);}
  for(let y=1;y<height-1;y++){add(y*width);add(y*width+width-1);}
  while(read<write){const i=queue[read++],x=i%width,y=(i/width)|0;if(x)add(i-1);if(x+1<width)add(i+1);if(y)add(i-width);if(y+1<height)add(i+width);}
  let minX=width,minY=height,maxX=-1,maxY=-1;
  for(let i=0;i<visited.length;i++){const p=i*4;if(visited[i])data[p+3]=0;else if(data[p+3]){const x=i%width,y=(i/width)|0;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}}
  if(maxX<minX) throw new Error('배경 외에 남은 그림 영역이 없습니다.');
  const out=document.createElement('canvas');out.width=maxX-minX+1;out.height=maxY-minY+1;
  const outCtx=out.getContext('2d');ctx.putImageData(frame,0,0);outCtx.drawImage(canvas,minX,minY,out.width,out.height,0,0,out.width,out.height);
  const blob=await new Promise(resolve=>out.toBlob(resolve,'image/png'));
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;
  a.download=file.name.replace(/\.png$/i,'-transparent.png');a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);
  return `${file.name} → ${a.download} (${out.width}×${out.height}), 제거된 가장자리 픽셀 ${write.toLocaleString()}개`;
}

document.getElementById('convert').addEventListener('click',async()=>{
  const files=[...fileInput.files];if(!files.length){status.textContent='먼저 PNG 파일을 선택하세요.';return;}
  const messages=[];for(const file of files){if(/^(background|bg)[-_]/i.test(file.name)){messages.push(`${file.name}: 배경 이미지는 변환하지 않았습니다.`);continue;}try{messages.push(await convert(file));}catch(error){messages.push(`${file.name}: 실패 (${error.message})`);}}
  status.textContent=messages.join('\n');
});
</script>
</html>
